name: Опубликовать демо для салонов

on:
  push:
    branches: [main]
    paths:
      - 'prospects/index.html'
      - 'prospects/bocha-home/**'
      - 'prospects/vtope/**'
      - 'prospects/blik/**'
      - 'prospects/koko/**'
      - 'prospects/lokon/**'
      - '.github/workflows/deploy-prospect-demos.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5
      - name: Собрать каталог и пять сайтов
        run: |
          mkdir -p _site
          cp prospects/index.html _site/index.html
          for site in bocha-home vtope blik koko lokon; do
            cp -R "prospects/$site" "_site/$site"
          done
      - name: Загрузить статический сайт
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Опубликовать GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
